[package]
name = "lightcraft-android"
description = "LightCraft on Android — hardware GPU-accelerated photo library & RAW developer with storage permissions and SAF file access"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "lightcraft_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam", "denoise"] }
lightcraft-sysmem.workspace = true
lightcraft-ui-egui.workspace = true
lightcraft-codecs.workspace = true
lightcraft-raster.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity", "default_fonts", "wgpu"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = "=0.22.4"
ndk = { version = "=0.9.0", default-features = false }

[lints]
workspace = true
